<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Aero Vista</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;600&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{overflow-y:scroll;height:100%;}
body{cursor:default;font-family:'Raleway',sans-serif;background:#000;overflow-x:hidden;}

/* ── CURSOR TRAIL EFFECT ── */
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95),rgba(160,220,255,0.6),rgba(80,180,240,0.2));border:1px solid rgba(255,255,255,0.8);box-shadow:0 0 10px rgba(120,200,255,0.5);mix-blend-mode:screen;transition:width 0.15s,height 0.15s;}
#cursor.big{width:55px;height:55px;}

/* ── TITLEBAR ── */
#titlebar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:44px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:translateY(-10px);
  transition:opacity 0.5s ease, transform 0.5s ease;
  background:linear-gradient(180deg,rgba(255,255,255,0.42) 0%,rgba(220,240,255,0.28) 100%);
  border-bottom:1px solid rgba(255,255,255,0.65);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 2px 20px rgba(80,160,220,0.18),inset 0 1px 0 rgba(255,255,255,0.9);
}
#titlebar.visible{opacity:1;transform:translateY(0);}

.traffic{position:absolute;left:16px;display:flex;gap:7px;align-items:center;}
.tl{width:13px;height:13px;border-radius:50%;transition: transform 0.1s; pointer-events: auto;}
.tl.r{background:radial-gradient(circle at 40% 35%,#ff8a8a,#e03030);box-shadow:0 1px 3px rgba(180,0,0,0.3);cursor: pointer;}
.tl.r:active{transform: scale(0.85);}
.tl.y{background:radial-gradient(circle at 40% 35%,#ffe080,#d4a000);box-shadow:0 1px 3px rgba(160,120,0,0.3);}
.tl.g{background:radial-gradient(circle at 40% 35%,#80e880,#20a020);box-shadow:0 1px 3px rgba(0,140,0,0.3);}

#titlebar-text{
  font-size:14px;font-weight:300;letter-spacing:5px;text-transform:uppercase;
  color:rgba(40,80,140,0.85);
  text-shadow:0 1px 3px rgba(255,255,255,0.8);
  user-select:none;
}

/* ── HERO TITLE ── */
#hero-title{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:190;text-align:center;pointer-events:none;
  will-change:transform,top,left,font-size,opacity,letter-spacing;
}
#hero-title h1{
  font-size:clamp(52px,9vw,108px);font-weight:200;letter-spacing:12px;
  color:rgba(255,255,255,0.97);
  text-shadow:0 2px 40px rgba(80,200,255,0.7),0 0 80px rgba(255,255,255,0.2);
  white-space:nowrap;
}

/* ── SECTIONS ── */
section{width:100vw;height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.06);transition:transform 0.1s linear;}
section::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,20,60,0.3) 100%);}
#s1 .bg{background-image:url('img1.jpg');background-color:#2090c8;}
#s2 .bg{background-image:url('img2.jpg');background-color:#3aaa50;}

.scroll-hint{
  position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  opacity:0;animation:hintIn 1s 2.5s ease forwards;
}
@keyframes hintIn{to{opacity:0.65;}}
.scroll-hint span{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.85);text-transform:uppercase;}
.scroll-arrow{width:1px;height:36px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.9));animation:arrowPulse 2s ease-in-out infinite;}
@keyframes arrowPulse{0%,100%{opacity:0.6;transform:scaleY(0.85);}50%{opacity:1;transform:scaleY(1.15);}}

#dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.35);border:1.5px solid rgba(255,255,255,0.7);cursor:pointer;transition:all 0.3s ease;}
.dot.active{background:rgba(255,255,255,0.95);transform:scale(1.4);box-shadow:0 0 7px rgba(255,255,255,0.7);}

.ripple{position:fixed;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);pointer-events:none;z-index:9996;animation:rippleOut 0.7s ease-out forwards;transform:translate(-50%,-50%) scale(0);}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(5);opacity:0;}}
.sparkle{position:fixed;width:5px;height:5px;background:#fff;border-radius:50%;pointer-events:none;z-index:9995;box-shadow:0 0 5px 2px rgba(200,240,255,0.8);animation:sparkPop ease-out forwards;}
@keyframes sparkPop{0%{transform:scale(0);opacity:1;}100%{transform:scale(2) translate(var(--dx),var(--dy));opacity:0;}}

/* ── CRT FLASH/SHUTDOWN OVERLAY ── */
#crt-overlay {
  position: fixed;inset: 0;background: #fff;z-index: 99998;opacity: 0;pointer-events: none;
}
#crt-overlay.shutdown {
  animation: crtCollapse 0.4s cubic-bezier(0.25, 1, 0.2, 1) forwards;
}
@keyframes crtCollapse {
  0% { opacity: 1; transform: scaleY(1) scaleX(1); background: #fff; }
  40% { transform: scaleY(0.005) scaleX(1); background: #e0f0ff; }
  85% { transform: scaleY(0.005) scaleX(0.02); background: #fff; opacity: 1; }
  100% { transform: scaleY(0) scaleX(0); background: #fff; opacity: 0; }
}

/* ── 3D RETRO MAIN STAGE CONTAINER ── */
#retro-stage {
  position: fixed;inset: 0;background: #040806;z-index: 99990;
  display: flex;flex-direction: column;align-items: center;justify-content: center;
  opacity: 0;pointer-events: none;transition: opacity 0.5s ease;
  perspective: 1000px;
}
#retro-stage.visible { opacity: 1; pointer-events: auto; }

/* Cinematic Zooming Camera Wrapper */
.camera-rig {
  display: flex;flex-direction: column;align-items: center;justify-content: center;
  transform: scale(2.2) translateY(50px); /* Starts up close on the screen */
  transition: transform 1.8s cubic-bezier(0.5, 0, 0.1, 1);
  will-change: transform;
}
.camera-rig.zoomed-out {
  transform: scale(0.95) translateY(-20px) rotateX(6deg); /* Cinematic structural workspace overview */
}

/* Ultra Realistic 3D iMac Assembly Structure */
.imac-3d-scene {
  position: relative;
  display: flex;flex-direction: column;align-items: center;
  transform-style: preserve-3d;
}

/* Semi translucent volumetric 3D extruded case wrapper */
.imac-chassis {
  position: relative;width: 610px;height: 520px;
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(140, 245, 255, 0.35) 0%, transparent 60%),
    radial-gradient(circle at 30% 30%, #1796a3 0%, #0c6a76 45%, #04383f 85%, #01191c 100%);
  border-radius: 100px 100px 150px 150px / 80px 80px 110px 110px;
  padding: 35px 40px 70px 40px;
  box-shadow: 
    0 40px 80px rgba(0,0,0,0.9), 
    inset 0 15px 30px rgba(255,255,255,0.5), 
    inset 0 -25px 50px rgba(0,0,0,0.85),
    0 12px 0 #04464e, /* Pseudo 3D Extrusion Side Wall */
    0 25px 30px rgba(0,0,0,0.6);
  display: flex;flex-direction: column;align-items: center;
}

.imac-screen-bezel {
  width: 100%;height: 380px;
  background: linear-gradient(135deg, #e1e7ec 0%, #c5ced4 100%);
  border-radius: 45px 45px 35px 35px / 35px 35px 25px 25px;
  padding: 22px 26px;
  box-shadow: inset 0 -6px 12px rgba(0,0,0,0.25), inset 0 4px 8px rgba(255,255,255,0.8);
  position: relative;
}

/* CRT monitor glass mask with interactive physics flicker layer */
.crt-screen {
  position: relative;width: 100%;height: 100%;
  background: #010402;border-radius: 35px / 25px;overflow: hidden;
  box-shadow: inset 0 0 50px rgba(0,0,0,1);border: 5px solid #1a1e20;
}
.crt-screen.active-flicker { animation: crtFlicker 0.15s infinite alternate; }

.crt-screen::before {
  content: '';position: absolute;inset: 0;
  background: radial-gradient(circle at 50% 15%, rgba(255,255,255,0.07) 0%, transparent 50%);
  z-index: 12;pointer-events: none;
}
.crt-screen::after {
  content: " ";display: block;position: absolute;inset: 0;
  background: linear-gradient(rgba(18, 26, 18, 0) 50%, rgba(0, 4, 0, 0.4) 50%), linear-gradient(90deg, rgba(38, 255, 38, 0.02), rgba(0, 0, 0, 0), rgba(0, 255, 0, 0.01));
  z-index: 11;background-size: 100% 4px, 6px 100%;pointer-events: none;
}

/* ── RETRO MAC SYSTEM REBOOT LOADING SCREEN ── */
.mac-load-overlay {
  position: absolute;inset: 0;background: #cbd3d8;z-index: 15;
  display: flex;flex-direction: column;align-items: center;justify-content: center;
  opacity: 0;transition: opacity 0.2s ease;pointer-events: none;
}
.mac-load-overlay.active { opacity: 1; }
.mac-load-logo { font-size: 55px; color: #555e64; margin-bottom: 25px; text-shadow: 0 1px 1px #fff; }
.mac-load-bar-box { width: 160px; height: 14px; background: #fff; border: 2px solid #7a858d; border-radius: 2px; padding: 1px; overflow: hidden; }
.mac-load-progress { width: 0%; height: 100%; background: #555e64; transition: width 0.1s linear; }

/* Terminal content view text system */
.terminal-wrapper { width: 100%;height: 100%;padding: 20px;overflow-y: auto;scrollbar-width: none; }
.terminal-wrapper::-webkit-scrollbar { display: none; }
.terminal-content {
  font-family: 'Fira Code', monospace;font-size: 11px;line-height: 1.6;
  color: #2eff3b;text-shadow: 0 0 6px rgba(46, 255, 59, 0.75);
  white-space: pre-wrap;word-break: break-all;display: block;
}

.glitch-text { color: #aeffad; text-shadow: 0 0 10px rgba(174, 255, 173, 0.9); font-weight: bold; }
.fatal-error { color: #ff3333; text-shadow: 0 0 10px rgba(255, 51, 51, 0.8); font-weight: bold; }
.interactive-cursor {
  display: inline-block;width: 7px;height: 13px;background-color: #2eff3b;
  box-shadow: 0 0 6px #2eff3b;margin-left: 2px;vertical-align: middle;
  animation: cursorBlink 0.8s infinite steps(2);display: none;
}
.interactive-cursor.active { display: inline-block; }

/* Deck Hardware layout elements */
.imac-lower-deck { position: absolute;bottom: 12px;width: 82%;display: flex;justify-content: space-between;align-items: center;padding: 0 10px; }
.speaker-grille { width: 65px;height: 25px;background-image: radial-gradient(rgba(0, 0, 0, 0.75) 15%, transparent 20%);background-size: 5px 5px;opacity: 0.4; }
.imac-power-node {
  width: 20px;height: 20px;border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #eefcff 0%, #5ce1e6 40%, #00a0b0 80%);
  box-shadow: 0 2px 5px rgba(0,0,0,0.3), 0 0 8px rgba(92, 225, 230, 0.6);
}
.apple-logo { position: absolute;bottom: 14px;left: 50%;transform: translateX(-50%);font-size: 22px;color: #117885; }
.imac-stand { width: 300px;height: 40px;background: linear-gradient(180deg, #d2dadf 0%, #90a5b0 100%);border-radius: 0 0 60px 60px / 0 0 30px 30px;box-shadow: 0 15px 25px rgba(0,0,0,0.5);margin-top: -12px;z-index: -1; }

/* ── PERSPECTIVE MATCHED DETAILED PHYSICAL KEYBOARD ── */
.imac-keyboard-3d {
  width: 440px;height: 110px;margin-top: 25px;
  background: linear-gradient(180deg, #e1e6eb 0%, #b8c3cc 100%);
  border-radius: 12px;transform: rotateX(35deg);transform-origin: top center;
  box-shadow: 
    0 15px 25px rgba(0,0,0,0.6), 
    0 2px 0 #9bb0be, 
    inset 0 2px 4px rgba(255,255,255,0.7);
  padding: 8px;display: flex;flex-direction: column;gap: 4px;
  border: 1px solid rgba(0,0,0,0.15);
}
.keyboard-row { display: flex;width: 100%;gap: 3px;justify-content: space-between; }
.key-cap {
  flex: 1;height: 14px;background: linear-gradient(180deg, #ffffff 0%, #e6ecef 100%);
  border-radius: 2px;box-shadow: 0 1.5px 1px rgba(0,0,0,0.25), inset 0 1px 0 #fff;
}
.key-cap.space-bar { flex: 5; }

/* Translucent Matching Bondi Blue Mouse */
.imac-mouse-3d {
  position: absolute;right: -100px;bottom: 10px;width: 42px;height: 65px;
  background: radial-gradient(circle at 50% 30%, #1cb0be 0%, #064b54 80%);
  border-radius: 20px 20px 22px 22px / 25px 25px 30px 30px;
  transform: rotateX(25deg) rotateY(-10deg);
  box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 3px 6px rgba(255,255,255,0.4);
  border: 1px solid rgba(255,255,255,0.1);
}
.imac-mouse-3d::before {
  content: '';position: absolute;top: 0;left: 50%;transform: translateX(-50%);
  width: 1px;height: 20px;background: rgba(0,0,0,0.2);
}

.imac-reboot-btn {
  margin-top: 45px;padding: 10px 26px;background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);border-radius: 20px;
  color: rgba(255,255,255,0.5);font-size: 11px;letter-spacing: 2px;
  text-transform: uppercase;cursor: pointer;transition: all 0.3s;
}
.imac-reboot-btn:hover { background: rgba(255,255,255,0.15);color: #fff; }

@keyframes crtFlicker { 0% { opacity: 0.985; } 100% { opacity: 1; } }
@keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<div id="cursor"></div>

<div id="titlebar">
  <div class="traffic"><div class="tl r" id="close-btn"></div><div class="tl y"></div><div class="tl g"></div></div>
  <div id="titlebar-text">AERO</div>
</div>

<div id="hero-title"><h1>AERO</h1></div>

<div id="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
</div>

<section id="s1">
  <div class="bg" id="bg1"></div>
  <div class="scroll-hint">
    <div class="scroll-arrow"></div>
    <span>scroll</span>
  </div>
</section>

<section id="s2">
  <div class="bg" id="bg2"></div>
</section>

<div id="crt-overlay"></div>

<div id="retro-stage">
  <div class="camera-rig" id="main-camera">
    <div class="imac-3d-scene">
      <div class="imac-chassis">
        <div class="imac-screen-bezel">
          <div class="crt-screen" id="hardware-glass">
            
            <div class="mac-load-overlay" id="loading-mask">
              <div class="mac-load-logo"></div>
              <div class="mac-load-bar-box">
                <div class="mac-load-progress" id="load-fluid"></div>
              </div>
            </div>
            
            <div class="terminal-wrapper" id="scroll-container">
              <span class="terminal-content" id="boot-terminal"></span><span class="interactive-cursor" id="term-cursor"></span>
            </div>
          </div>
          
          <div class="imac-lower-deck">
            <div class="speaker-grille"></div>
            <div class="imac-power-node"></div>
            <div class="speaker-grille"></div>
          </div>
          <div class="apple-logo"></div>
        </div>
      </div>
      <div class="imac-stand"></div>
      
      <div class="imac-keyboard-3d">
        <div class="keyboard-row"><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div></div>
        <div class="keyboard-row"><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div></div>
        <div class="keyboard-row"><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap space-bar"></div><div class="key-cap"></div><div class="key-cap"></div><div class="key-cap"></div></div>
      </div>
      <div class="imac-mouse-3d"></div>
    </div>
    
    <button class="imac-reboot-btn" id="terminal-exit">Reboot Mainframe</button>
  </div>
</div>

<script>
// ── CURSOR TRAIL POSITIONING ──
const cursor=document.getElementById('cursor');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
document.addEventListener('mousedown',()=>cursor.classList.add('big'));
document.addEventListener('mouseup',()=>cursor.classList.remove('big'));

// ── TITLEBAR + HERO TITLE ANIMATION ──
const heroTitle=document.getElementById('hero-title');
const titlebar=document.getElementById('titlebar');
const heroH1=heroTitle.querySelector('h1');
let titleSettled=false;

function updateTitle(){
  const scrollY=window.scrollY;
  const vh=window.innerHeight;
  const progress=Math.min(1,scrollY/(vh*0.38));

  if(progress<=0){
    heroTitle.style.transition='top 0.6s cubic-bezier(0.4,0,0.2,1), left 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease';
    heroTitle.style.top='50%';heroTitle.style.left='50%';heroTitle.style.transform='translate(-50%,-50%)';heroTitle.style.opacity='1';
    titlebar.classList.remove('visible');titleSettled=false;return;
  }

  if(progress<1){
    const startTop=50,endTop=22/vh*100;
    const curTop=startTop+(endTop-startTop)*easeInOut(progress);
    const scale=1-progress*0.88;
    heroTitle.style.transition='none';heroTitle.style.top=curTop+'vh';heroTitle.style.left='50%';heroTitle.style.transform=`translate(-50%,-50%) scale(${scale})`;heroTitle.style.opacity='1';
    
    const startFs=Math.min(108,Math.max(52,window.innerWidth*0.09)),endFs=14;
    const fs=startFs+(endFs-startFs)*easeInOut(progress);
    const startLs=12,endLs=5;const ls=startLs+(endLs-startLs)*easeInOut(progress);
    
    const r1=255,g1=255,b1=255,r2=40,g2=80,b2=140;
    const ri=Math.round(r1+(r2-r1)*easeInOut(progress));const gi=Math.round(g1+(g2-g1)*easeInOut(progress));const bi=Math.round(b1+(b2-b1)*easeInOut(progress));
    
    heroH1.style.fontSize=fs+'px';heroH1.style.letterSpacing=ls+'px';heroH1.style.color=`rgba(${ri},${gi},${bi},0.9)`;
    heroH1.style.textShadow=`0 1px ${20-18*easeInOut(progress)}px rgba(80,200,255,${0.7-0.6*easeInOut(progress)})`;
    titleSettled=false;titlebar.classList.remove('visible');
  } else {
    if(!titleSettled){
      titleSettled=true;heroTitle.style.opacity='0';heroTitle.style.transition='opacity 0.2s ease';titlebar.classList.add('visible');
    }
  }
}
function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
window.addEventListener('scroll',updateTitle,{passive:true});
updateTitle();

// ── PARALLAX ──
function updateParallax(){
  const scrollY=window.scrollY;const vh=window.innerHeight;
  document.querySelectorAll('section').forEach(s=>{
    const bg=s.querySelector('.bg');if(!bg) return;
    const rect=s.getBoundingClientRect();const prog=rect.top/vh;
    const nx=(mx/window.innerWidth-0.5)*2;const ny=(my/window.innerHeight-0.5)*2;
    bg.style.transform=`scale(1.06) translate(${nx*10}px,${ny*8+prog*25}px)`;
  });
}
document.addEventListener('mousemove',updateParallax);
window.addEventListener('scroll',updateParallax,{passive:true});

// ── DOTS ──
const dots=document.querySelectorAll('.dot');const sections=document.querySelectorAll('section');
dots.forEach(d=>{d.addEventListener('click',()=>sections[+d.dataset.i].scrollIntoView({behavior:'smooth'}));});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i=Array.from(sections).indexOf(e.target);
      dots.forEach((d,j)=>d.classList.toggle('active',i===j));
    }
  });
},{threshold:0.6});
sections.forEach(s=>obs.observe(s));

// ── CLICK EFFECTS ──
document.addEventListener('click',e=>{
  if (e.target.closest('#close-btn') || e.target.closest('#terminal-exit')) return;
  const r=document.createElement('div');r.className='ripple';r.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:40px;height:40px;`;
  document.body.appendChild(r);setTimeout(()=>r.remove(),750);
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='sparkle';const a=Math.random()*Math.PI*2,d=15+Math.random()*45;
    s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--dx',(Math.cos(a)*d)+'px');s.style.setProperty('--dy',(Math.sin(a)*d)+'px');s.style.animationDuration=(0.35+Math.random()*0.4)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),800);
  }
});

// ── REPL DIALOGUE TIMELINE DATA ──
const timeline = [
  { text: "# System: KingSolution 2.0. / Digital Circus Mainframe.\n", delay: 25, postWait: 200 },
  { text: "# Date: 1996-10-30.\n", delay: 25, postWait: 200 },
  { text: "# Host: circus digital.\n\n", delay: 25, postWait: 600 },
  { text: "Initializing telnet connection...\n", delay: 35, postWait: 900 },
  { text: "Login: kinger\n", delay: 120, postWait: 500 },
  { text: "Pass: ******\n\n", delay: 180, postWait: 800 },
  { text: "kinger@circus:~$ ", delay: 0, postWait: 300 },

// ── CINEMATIC RETRO PIPELINE STAGE MECHANISMS ──
const closeBtn = document.getElementById('close-btn');
const crtOverlay = document.getElementById('crt-overlay');
const retroStage = document.getElementById('retro-stage');
const mainCamera = document.getElementById('main-camera');
const hardwareGlass = document.getElementById('hardware-glass');
const loadingMask = document.getElementById('loading-mask');
const loadFluid = document.getElementById('load-fluid');
const bootTerminal = document.getElementById('boot-terminal');
const termCursor = document.getElementById('term-cursor');
const scrollContainer = document.getElementById('scroll-container');
const terminalExit = document.getElementById('terminal-exit');

let stepIndex = 0;
let typeTimeout = null;

closeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const currentSlideIndex = Array.from(dots).findIndex(d => d.classList.contains('active'));
  if (currentSlideIndex !== 1) return;

  // Step 1: CRT screen collapses to white line and goes black
  crtOverlay.classList.add('shutdown');
  
  setTimeout(() => {
    retroStage.classList.add('visible');
    hardwareGlass.classList.remove('active-flicker');
    loadingMask.classList.remove('active');
    termCursor.classList.remove('active');
    bootTerminal.innerHTML = "";
    mainCamera.classList.remove('zoomed-out'); // Ensure it starts up close
  }, 200);

  // Step 2: Clear shutdown flash, screen stays black, then zoom out wide
  setTimeout(() => {
    crtOverlay.classList.remove('shutdown');
  }, 450);

  setTimeout(() => {
    mainCamera.classList.add('zoomed-out');
  }, 700);

  // Step 3: Mac powers up, glowing grey loading screen bar builds up
  setTimeout(() => {
    loadingMask.classList.add('active');
    animateLoadingBar(0);
  }, 2500);
});

function animateLoadingBar(progress) {
  if (progress <= 100) {
    loadFluid.style.width = progress + '%';
    // Variable step speeds for retro authenticity
    let nextStep = progress + Math.floor(Math.random() * 8) + 2;
    let speed = Math.floor(Math.random() * 120) + 40;
    setTimeout(() => animateLoadingBar(nextStep), speed);
  } else {
    // Step 4: Loading complete, remove grey mask, activate screen terminal text
    loadingMask.classList.remove('active');
    hardwareGlass.classList.add('active-flicker');
    termCursor.classList.add('active');
    stepIndex = 0;
    runSimulation();
  }
}

function runSimulation() {
  if (stepIndex >= timeline.length) return;

  const currentStep = timeline[stepIndex];
  let charIndex = 0;
  
  let targetNode = document.createElement('span');
  if (currentStep.type === "glitch") targetNode.classList.add('glitch-text');
  if (currentStep.type === "error") targetNode.classList.add('fatal-error');
  bootTerminal.appendChild(targetNode);

  function typeCharacter() {
    if (charIndex < currentStep.text.length) {
      targetNode.textContent += currentStep.text.charAt(charIndex);
      charIndex++;
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
      typeTimeout = setTimeout(typeCharacter, currentStep.delay);
    } else {
      stepIndex++;
      typeTimeout = setTimeout(runSimulation, currentStep.postWait);
    }
  }
  typeCharacter();
}

terminalExit.addEventListener('click', () => {
  clearTimeout(typeTimeout);
  retroStage.classList.remove('visible');
});
</script>
