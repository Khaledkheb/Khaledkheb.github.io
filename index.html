<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Aero Vista</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{overflow-y:scroll;height:100%;}
/* Changed cursor from 'none' to 'default' to make the native mouse show */
body{cursor:default;font-family:'Raleway',sans-serif;background:#000;overflow-x:hidden;}

/* ── CURSOR TRAIL ── */
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95),rgba(160,220,255,0.6),rgba(80,180,240,0.2));border:1px solid rgba(255,255,255,0.8);box-shadow:0 0 10px rgba(120,200,255,0.5);mix-blend-mode:screen;transition:width 0.15s,height 0.15s;}
#cursor.big{width:55px;height:55px;}

/* ── TITLEBAR ── */
#titlebar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:44px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:translateY(-10px);
  transition:opacity 0.5s ease, transform 0.5s ease;
  background:linear-gradient(180deg,rgba(255,255,255,0.42) 0%,rgba(220,240,255,0.28) 100%);
  border-bottom:1px solid rgba(255,255,255,0.65);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 2px 20px rgba(80,160,220,0.18),inset 0 1px 0 rgba(255,255,255,0.9);
}
#titlebar.visible{opacity:1;transform:translateY(0);}

/* traffic light dots */
.traffic{position:absolute;left:16px;display:flex;gap:7px;align-items:center;}
.tl{width:13px;height:13px;border-radius:50%;transition: transform 0.1s; pointer-events: auto;}
/* Changed cursor from 'none' to 'pointer' */
.tl.r{background:radial-gradient(circle at 40% 35%,#ff8a8a,#e03030);box-shadow:0 1px 3px rgba(180,0,0,0.3);cursor: pointer;}
.tl.r:active{transform: scale(0.85);}
.tl.y{background:radial-gradient(circle at 40% 35%,#ffe080,#d4a000);box-shadow:0 1px 3px rgba(160,120,0,0.3);}
.tl.g{background:radial-gradient(circle at 40% 35%,#80e880,#20a020);box-shadow:0 1px 3px rgba(0,140,0,0.3);}

#titlebar-text{
  font-size:14px;font-weight:300;letter-spacing:5px;text-transform:uppercase;
  color:rgba(40,80,140,0.85);
  text-shadow:0 1px 3px rgba(255,255,255,0.8);
  user-select:none;
}

/* ── HERO TITLE ── */
#hero-title{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:190;
  text-align:center;
  pointer-events:none;
  transition:none;
  will-change:transform,top,left,font-size,opacity,letter-spacing;
}
#hero-title h1{
  font-size:clamp(52px,9vw,108px);
  font-weight:200;
  letter-spacing:12px;
  color:rgba(255,255,255,0.97);
  text-shadow:0 2px 40px rgba(80,200,255,0.7),0 0 80px rgba(255,255,255,0.2);
  white-space:nowrap;
  transition:font-size 0.6s cubic-bezier(0.4,0,0.2,1),
             letter-spacing 0.6s cubic-bezier(0.4,0,0.2,1),
             color 0.6s ease,
             text-shadow 0.6s ease;
}

/* ── SECTIONS ── */
section{
  width:100vw;height:100vh;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

.bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transform:scale(1.06);
  transition:transform 0.1s linear;
  will-change:transform;
}

section::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,20,60,0.3) 100%);
}

#s1 .bg{background-image:url('img1.jpg');background-color:#2090c8;}
#s2 .bg{background-image:url('img2.jpg');background-color:#3aaa50;}

/* Scroll Hint */
.scroll-hint{
  position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;
  opacity:0;animation:hintIn 1s 2.5s ease forwards;
}
@keyframes hintIn{to{opacity:0.65;}}
.scroll-hint span{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.85);text-transform:uppercase;}
.scroll-arrow{width:1px;height:36px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.9));animation:arrowPulse 2s ease-in-out infinite;}
@keyframes arrowPulse{0%,100%{opacity:0.6;transform:scaleY(0.85);}50%{opacity:1;transform:scaleY(1.15);}}

/* Navigation Dots */
#dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;}
/* Changed dot cursor to 'pointer' */
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.35);border:1.5px solid rgba(255,255,255,0.7);cursor:pointer;transition:all 0.3s ease;}
.dot.active{background:rgba(255,255,255,0.95);transform:scale(1.4);box-shadow:0 0 7px rgba(255,255,255,0.7);}

/* Ripple & Sparkle */
.ripple{position:fixed;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);pointer-events:none;z-index:9996;animation:rippleOut 0.7s ease-out forwards;transform:translate(-50%,-50%) scale(0);}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(5);opacity:0;}}
.sparkle{position:fixed;width:5px;height:5px;background:#fff;border-radius:50%;pointer-events:none;z-index:9995;box-shadow:0 0 5px 2px rgba(200,240,255,0.8);animation:sparkPop ease-out forwards;}
@keyframes sparkPop{0%{transform:scale(0);opacity:1;}100%{transform:scale(2) translate(var(--dx),var(--dy));opacity:0;}}

/* ── CRT SHUTDOWN ANIMATION LAYER ── */
#crt-overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 99998;
  opacity: 0;
  pointer-events: none;
}
#crt-overlay.shutdown {
  animation: crtCollapse 0.6s cubic-bezier(0.25, 1, 0.2, 1) forwards;
}
@keyframes crtCollapse {
  0% { opacity: 1; transform: scaleY(1) scaleX(1); background: #fff; }
  30% { transform: scaleY(0.005) scaleX(1); background: #e0f0ff; }
  70% { transform: scaleY(0.005) scaleX(0.05); background: #fff; opacity: 1; }
  100% { transform: scaleY(0) scaleX(0); background: #fff; opacity: 0; }
}

/* ── RETRO IMAC BOOTSTAGE ── */
#retro-stage {
  position: fixed;
  inset: 0;
  background: #090e14;
  z-index: 99990;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
#retro-stage.visible {
  opacity: 1;
  pointer-events: auto;
}

/* Realistic Bondi Blue iMac G3 Chassis Frame */
.imac-wrapper {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.imac-chassis {
  position: relative;
  width: 640px;
  height: 560px;
  /* Bondi Blue signature translucent housing layers */
  background: 
    radial-gradient(ellipse at 50% 15%, rgba(130, 240, 255, 0.25) 0%, transparent 60%),
    radial-gradient(circle at 35% 30%, #1793a1 0%, #0d6d79 40%, #053b42 80%, #021e22 100%);
  border-radius: 110px 110px 160px 160px / 90px 90px 120px 120px;
  padding: 40px 45px 75px 45px;
  /* 3D volumetric extrusion shadows */
  box-shadow: 
    0 45px 90px rgba(0,0,0,0.85), 
    inset 0 14px 25px rgba(255,255,255,0.45), 
    inset 0 -30px 60px rgba(0,0,0,0.8),
    0 10px 0 #044b54,
    0 20px 30px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
}

/* Realistic Internal Plastic Bezel Accent */
.imac-chassis::before {
  content: '';
  position: absolute;
  inset: 16px;
  border-radius: 95px 95px 145px 145px / 75px 75px 105px 105px;
  border: 4px solid rgba(255,255,255,0.12);
  background: radial-gradient(circle at 50% 100%, transparent 70%, rgba(255,255,255,0.08) 100%);
  pointer-events: none;
}

/* Inner Light-Gray Screen Bezel Component */
.imac-screen-bezel {
  width: 100%;
  height: 410px;
  background: linear-gradient(135deg, #e6ecf0 0%, #ccd5db 100%);
  border-radius: 50px 50px 40px 40px / 40px 40px 30px 30px;
  padding: 24px 28px;
  box-shadow: 
    inset 0 -6px 12px rgba(0,0,0,0.25), 
    inset 0 4px 8px rgba(255,255,255,0.8),
    0 8px 20px rgba(0,0,0,0.4);
  position: relative;
}

/* The actual curved CRT display glass */
.crt-screen {
  position: relative;
  width: 100%;
  height: 100%;
  background: #010502;
  border-radius: 45px / 30px;
  overflow: hidden;
  box-shadow: 
    inset 0 0 40px rgba(0,0,0,1),
    0 2px 2px rgba(255,255,255,0.6);
  border: 5px solid #1c2022;
}

/* CRT Screen Glare and Curvature overlay distortion */
.crt-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 15%, rgba(255,255,255,0.12) 0%, transparent 50%);
  z-index: 12;
  pointer-events: none;
}

/* Scanline grid mask layering */
.crt-screen::after {
  content: " ";
  display: block;
  position: absolute;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
  z-index: 11;
  background-size: 100% 4px, 6px 100%;
  pointer-events: none;
}

/* Lower Speaker Grille Ring System & Iridescent Power Button Area */
.imac-lower-deck {
  position: absolute;
  bottom: 12px;
  width: 82%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px;
}

/* Pin-hole speaker mesh clusters */
.speaker-grille {
  width: 65px;
  height: 25px;
  background-image: radial-gradient(rgba(0, 0, 0, 0.75) 15%, transparent 20%);
  background-size: 5px 5px;
  opacity: 0.4;
}

/* Glowing translucent round modern pulse power mechanism button */
.imac-power-node {
  width: 22px;
  height: 22px;
  background: radial-gradient(circle at 35% 30%, #eefcff 0%, #5ce1e6 40%, #00a0b0 80%);
  border-radius: 50%;
  box-shadow: 
    0 2px 6px rgba(0,0,0,0.3),
    inset 0 1px 2px #fff,
    0 0 12px rgba(92, 225, 230, 0.7);
  animation: powerGlow 3s ease-in-out infinite alternate;
}
@keyframes powerGlow {
  0% { box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 0 6px rgba(92, 225, 230, 0.4); }
  100% { box-shadow: 0 2px 6px rgba(0,0,0,0.3), 0 0 16px rgba(92, 225, 230, 0.9); }
}

/* Retro Apple Logo Accent placement centring */
.apple-logo {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 24px;
  color: #117885;
  text-shadow: 0 1px 1px rgba(255,255,255,0.3);
}

/* Matrix Code Terminal Content Box */
.terminal-content {
  width: 100%;
  height: 100%;
  padding: 24px;
  font-family: 'Fira Code', 'Courier New', monospace;
  font-size: 11px;
  line-height: 1.6;
  color: #26ff26;
  text-shadow: 0 0 8px rgba(38, 255, 38, 0.85);
  box-sizing: border-box;
  overflow: hidden;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Computer Stand/Tilt Support Base Element */
.imac-stand {
  width: 320px;
  height: 45px;
  background: linear-gradient(180deg, #dae3e8 0%, #9cb1bc 100%);
  border-radius: 0 0 60px 60px / 0 0 30px 30px;
  box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 4px 6px rgba(255,255,255,0.5);
  margin-top: -15px;
  z-index: -1;
  position: relative;
}
.imac-stand::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; width: 80%; height: 8px;
  background: rgba(0,0,0,0.15);
}

/* Power button to escape back out */
.imac-reboot-btn {
  margin-top: 35px;
  padding: 10px 24px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  color: rgba(255,255,255,0.5);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s;
}
.imac-reboot-btn:hover {
  background: rgba(255,255,255,0.15);
  color: #fff;
  box-shadow: 0 0 15px rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<div id="cursor"></div>

<div id="titlebar">
  <div class="traffic"><div class="tl r" id="close-btn"></div><div class="tl y"></div><div class="tl g"></div></div>
  <div id="titlebar-text">AERO</div>
</div>

<div id="hero-title"><h1>AERO</h1></div>

<div id="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
</div>

<section id="s1">
  <div class="bg" id="bg1"></div>
  <div class="scroll-hint">
    <div class="scroll-arrow"></div>
    <span>scroll</span>
  </div>
</section>

<section id="s2">
  <div class="bg" id="bg2"></div>
</section>

<div id="crt-overlay"></div>

<div id="retro-stage">
  <div class="imac-wrapper">
    <div class="imac-chassis">
      <div class="imac-screen-bezel">
        <div class="crt-screen">
          <div class="terminal-content" id="boot-terminal"></div>
        </div>
        
        <div class="imac-lower-deck">
          <div class="speaker-grille"></div>
          <div class="imac-power-node"></div>
          <div class="speaker-grille"></div>
        </div>
        <div class="apple-logo"></div>
      </div>
    </div>
    <div class="imac-stand"></div>
    <button class="imac-reboot-btn" id="terminal-exit">Reboot Mainframe</button>
  </div>
</div>

<script>
// ── CURSOR TRAIL POSITIONING ──
const cursor=document.getElementById('cursor');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
document.addEventListener('mousedown',()=>cursor.classList.add('big'));
document.addEventListener('mouseup',()=>cursor.classList.remove('big'));

// ── TITLEBAR + HERO TITLE ANIMATION ──
const heroTitle=document.getElementById('hero-title');
const titlebar=document.getElementById('titlebar');
const heroH1=heroTitle.querySelector('h1');
let titleSettled=false;
let titleVisible=false;

function updateTitle(){
  const scrollY=window.scrollY;
  const vh=window.innerHeight;
  const progress=Math.min(1,scrollY/(vh*0.38));

  if(progress<=0){
    heroTitle.style.transition='top 0.6s cubic-bezier(0.4,0,0.2,1), left 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease';
    heroTitle.style.top='50%';
    heroTitle.style.left='50%';
    heroTitle.style.transform='translate(-50%,-50%)';
    heroTitle.style.opacity='1';
    heroTitle.classList.remove('settled');
    titlebar.classList.remove('visible');
    titleSettled=false;
    titleVisible=false;
    return;
  }

  if(progress<1){
    const startTop=50;
    const endTop=22/vh*100;
    const curTop=startTop+(endTop-startTop)*easeInOut(progress);
    const scale=1-progress*0.88;
    const opacity=1;
    heroTitle.style.transition='none';
    heroTitle.style.top=curTop+'vh';
    heroTitle.style.left='50%';
    heroTitle.style.transform=`translate(-50%,-50%) scale(${scale})`;
    heroTitle.style.opacity=opacity;
    const startFs=Math.min(108,Math.max(52,window.innerWidth*0.09));
    const endFs=14;
    const fs=startFs+(endFs-startFs)*easeInOut(progress);
    const startLs=12,endLs=5;
    const ls=startLs+(endLs-startLs)*easeInOut(progress);
    const r1=255,g1=255,b1=255,a1=0.97;
    const r2=40,g2=80,b2=140,a2=0.85;
    const ri=Math.round(r1+(r2-r1)*easeInOut(progress));
    const gi=Math.round(g1+(g2-g1)*easeInOut(progress));
    const bi=Math.round(b1+(b2-b1)*easeInOut(progress));
    const ai=(a1+(a2-a1)*easeInOut(progress)).toFixed(2);
    heroH1.style.fontSize=fs+'px';
    heroH1.style.letterSpacing=ls+'px';
    heroH1.style.color=`rgba(${ri},${gi},${bi},${ai})`;
    heroH1.style.textShadow=`0 1px ${20-18*easeInOut(progress)}px rgba(80,200,255,${0.7-0.6*easeInOut(progress)})`;
    titleSettled=false;
    titleVisible=false;
    titlebar.classList.remove('visible');
  } else {
    if(!titleSettled){
      titleSettled=true;
      heroTitle.style.opacity='0';
      heroTitle.style.transition='opacity 0.2s ease';
      titlebar.classList.add('visible');
    }
  }
}

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

window.addEventListener('scroll',updateTitle,{passive:true});
updateTitle();

// ── PARALLAX ──
function updateParallax(){
  const scrollY=window.scrollY;
  const vh=window.innerHeight;
  document.querySelectorAll('section').forEach(s=>{
    const bg=s.querySelector('.bg');
    if(!bg) return;
    const rect=s.getBoundingClientRect();
    const prog=rect.top/vh;
    const nx=(mx/window.innerWidth-0.5)*2;
    const ny=(my/window.innerHeight-0.5)*2;
    bg.style.transform=`scale(1.06) translate(${nx*10}px,${ny*8+prog*25}px)`;
  });
}
document.addEventListener('mousemove',updateParallax);
window.addEventListener('scroll',updateParallax,{passive:true});

// ── DOTS ──
const dots=document.querySelectorAll('.dot');
const sections=document.querySelectorAll('section');
dots.forEach(d=>{
  d.addEventListener('click',()=>sections[+d.dataset.i].scrollIntoView({behavior:'smooth'}));
});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i=Array.from(sections).indexOf(e.target);
      dots.forEach((d,j)=>d.classList.toggle('active',i===j));
    }
  });
},{threshold:0.6});
sections.forEach(s=>obs.observe(s));

// ── CLICK EFFECTS ──
document.addEventListener('click',e=>{
  if (e.target.closest('#close-btn') || e.target.closest('#terminal-exit')) return;
  const r=document.createElement('div');
  r.className='ripple';
  r.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:40px;height:40px;`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),750);
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    const a=Math.random()*Math.PI*2,d=15+Math.random()*45;
    s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.animationDuration=(0.35+Math.random()*0.4)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
});

// ── RETRO SHUTDOWN AND BOOT SIMULATION ──
const closeBtn = document.getElementById('close-btn');
const crtOverlay = document.getElementById('crt-overlay');
const retroStage = document.getElementById('retro-stage');
const bootTerminal = document.getElementById('boot-terminal');
const terminalExit = document.getElementById('terminal-exit');
let bootInterval = null;

const bootLines = [
  "AERO VISTA MACINTOSH CORE v1.0.4 BOOTING...",
  "SYSTEM ARCHITECTURE: POWERPC G3 RETRO ACTIVE",
  "INITIALIZING INTEGRATED MONAURAL SPEAKER SYSTEM... OK",
  "DETECTING CATHODE-RAY TUBE MONITOR TARGET FREQUENCY... 60HZ SYNC",
  "ALLOCATING EMULATED HEAP DRIVE VRAM... 512MB RAM INITIALIZED",
  "LOADING BONDI BLUE TRANSLUCENT ASSEMBLY ENGINE...",
  "MOUNTING PRIMARY STORAGE DISK SYSTEM (/dev/mac1)... SUCCESS",
  "DECRYPTING MATRIX TERMINAL MODULE PATHWAY...",
  "--------------------------------------------------",
  "WARNING: DIRECT MEMORY ARCHITECTURE INTRUSION DETECTED",
  "BYPASSING SECURE HARDWARE ENCLAVE SECURITY... ACCESS GRANTED",
  "INITIALIZING SYSTEM CODE CORE GREEN RUNTIME INTERFACE...",
  "STATUS: TERMINATION FAULT CLEARED. SCREEN STABLE. AWAKE."
];

closeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  
  const currentSlideIndex = Array.from(dots).findIndex(d => d.classList.contains('active'));
  if (currentSlideIndex !== 1) return;

  crtOverlay.classList.add('shutdown');
  
  setTimeout(() => {
    retroStage.classList.add('visible');
    bootTerminal.textContent = "";
  }, 350);

  setTimeout(() => {
    crtOverlay.classList.remove('shutdown');
    runBootSequence();
  }, 650);
});

function runBootSequence() {
  let lineIndex = 0;
  clearInterval(bootInterval);
  
  bootInterval = setInterval(() => {
    if (lineIndex < bootLines.length) {
      bootTerminal.textContent += bootLines[lineIndex] + "\n";
      lineIndex++;
    } else {
      const hexChars = "0123456789ABCDEFSYSTEMFAILURE//X//";
      let randomLine = "";
      for(let i=0; i<30; i++) {
        randomLine += hexChars.charAt(Math.floor(Math.random() * hexChars.length)) + " ";
      }
      bootTerminal.textContent += randomLine + "\n";
      bootTerminal.scrollTop = bootTerminal.scrollHeight;
    }
  }, 180);
}

terminalExit.addEventListener('click', () => {
  clearInterval(bootInterval);
  retroStage.classList.remove('visible');
});
</script>
</body>
