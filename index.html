<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Jester's Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;600;700&display=swap" rel="stylesheet">
<style>
/* 1. CORE SNAP-SCROLL CONTAINER SETUP */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: #000;
  overflow: hidden; 
}

body {
  cursor: none;
  font-family: 'Raleway', sans-serif;
}

#scroll-container {
  width: 100vw;
  height: 100vh;
  overflow-y: scroll;
  overflow-x: hidden;
  scroll-behavior: smooth;
  scroll-snap-type: y mandatory;
  position: relative;
  background: #000;
}

/* 2. CUSTOM INTERACTIVE CURSOR */
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,rgba(255,50,50,0.95),rgba(100,0,0,0.6),rgba(0,0,0,0.2));border:1px solid rgba(255,100,100,0.8);box-shadow:0 0 10px rgba(255,0,0,0.5);mix-blend-mode:screen;transition:width 0.15s,height 0.15s;}
#cursor.big{width:55px;height:55px;}

/* 3. TITLEBAR UI */
#titlebar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:44px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(40,0,0,0.6) 0%,rgba(0,0,0,0.8) 100%);
  border-bottom:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.traffic{position:absolute;left:16px;display:flex;gap:7px;align-items:center;}
.tl{width:13px;height:13px;border-radius:50%;}
.tl.r{background:radial-gradient(circle at 40% 35%,#ff4d4d,#800000);box-shadow:0 1px 3px rgba(100,0,0,0.5);}
.tl.y{background:radial-gradient(circle at 40% 35%,#555,#111);}
.tl.g{background:radial-gradient(circle at 40% 35%,#555,#111);}

/* 4. SLIDES SECTION ARCHITECTURE */
section{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.bg{
  position:absolute;inset:0;
  background-position:center;
  background-repeat:no-repeat;
  will-change:transform;
}

section:not(#s2)::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,0.6) 100%);
}

/* Slide 1 Background */
#s1 .bg{
  background-size: cover;
  background-color:#2a0000;
  background-image: radial-gradient(circle at 50% 45%, #4a0404 0%, #1a0101 60%, #000000 100%);
}

/* Slide 2 WebGL Shader Canvas Mount */
#s2 {
    background: #000;
}
.terminal-canvas-container {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

/* 5. PRESENTATION PANEL DESIGN CARDS */
.jester-display-panel {
  position: relative;
  z-index: 10;
  text-align: center;
  width: 85%;
  max-width: 850px;
  padding: 55px 45px;
  background: linear-gradient(135deg, rgba(60, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.7) 100%);
  border: 1px solid rgba(255, 50, 50, 0.2);
  border-radius: 28px;
  backdrop-filter: blur(25px) saturate(1.2);
  -webkit-backdrop-filter: blur(25px) saturate(1.2);
  box-shadow: 0 40px 70px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 100, 100, 0.15);
}

.jester-panel-overlay {
  position: absolute;
  top: -55px;    
  right: -48px;  
  width: 155px;  
  height: auto;
  z-index: 20;   
  transform: rotate(15deg); 
  transform-origin: center center;
  pointer-events: none; 
  filter: drop-shadow(5px 12px 16px rgba(0,0,0,0.75)); 
}

.text-type-wrapper {
  position: relative;
  z-index: 15; 
}

/* Slide 2 Container Layout Mesh */
.jester-content-card {
  z-index: 10;
  width: 92%;
  max-width: 1100px;
  background: linear-gradient(135deg, rgba(40, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.8) 100%);
  border: 1px solid rgba(255, 50, 50, 0.2);
  border-radius: 28px;
  backdrop-filter: blur(15px);
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
  padding: 60px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

/* 6. TYPING STRINGS GLYPH STYLING */
.text-type {
  display: inline-block;
  white-space: pre-wrap;
  font-size: clamp(22px, 3.8vw, 42px);
  font-weight: 300;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 0 4px 20px rgba(255, 0, 0, 0.5), 0 0 30px rgba(0, 0, 0, 0.4);
  line-height: 1.4;
  min-height: 3.2em;
}

.text-type__cursor {
  margin-left: 0.2rem;
  display: inline-block;
  font-weight: 200;
  color: #ff4d4d;
  text-shadow: 0 0 12px #ff0000;
  animation: cursorBlink 0.8s ease-in-out infinite alternate;
}
@keyframes cursorBlink {
  from { opacity: 1; }
  to { opacity: 0; }
}

/* 7. CURVED PATH TEXT ENGINE DISPLAY */
.curved-loop-jacket {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 6%, #000 94%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 6%, #000 94%, transparent 100%);
}

.curved-loop-svg {
  user-select: none;
  width: 100%;
  aspect-ratio: 1440 / 220;
  overflow: visible;
  display: block;
}

.curved-loop-svg text {
  font-size: 2.8rem;
  font-weight: 700;
  text-transform: uppercase;
  fill: #ffffff;
  text-shadow: 0 4px 16px rgba(150, 0, 0, 0.6);
  letter-spacing: 2px;
}

/* 8. UI ACCENTS & TRANSITIONS */
.scroll-hint{
  position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;
  opacity:0;animation:hintIn 1s 2.5s ease forwards;
}
@keyframes hintIn{to{opacity:0.65;}}
.scroll-hint span{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.85);text-transform:uppercase;}
.scroll-arrow{width:1px;height:36px;background:linear-gradient(180deg,transparent,rgba(255,50,50,0.9));animation:arrowPulse 2s ease-in-out infinite;}
@keyframes arrowPulse{0%,100%{opacity:0.6;transform:scaleY(0.85);}50%{opacity:1;transform:scaleY(1.15);}}

#dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);cursor:none;transition:all 0.3s ease;}
.dot.active{background:rgba(255,50,50,0.95);transform:scale(1.4);box-shadow:0 0 7px rgba(255,0,0,0.7);}

.ripple{position:fixed;border-radius:50%;border:1.5px solid rgba(255,0,0,0.6);pointer-events:none;z-index:9996;animation:rippleOut 0.7s ease-out forwards;transform:translate(-50%,-50%) scale(0);}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(5);opacity:0;}}
.sparkle{position:fixed;width:5px;height:5px;background:#ff3333;border-radius:50%;pointer-events:none;z-index:9995;box-shadow:0 0 5px 2px rgba(255,0,0,0.8);animation:sparkPop ease-out forwards;}
@keyframes sparkPop{0%{transform:scale(0);opacity:1;}100%{transform:scale(2) translate(var(--dx),var(--dy));opacity:0;}}
</style>
</head>
<body>

<div id="cursor"></div>

<div id="titlebar">
  <div class="traffic"><div class="tl r"></div><div class="tl y"></div><div class="tl g"></div></div>
</div>

<div id="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
</div>

<div id="scroll-container">

  <section id="s1">
    <div class="bg" id="bg1"></div>
    <div class="jester-display-panel">
       <img src="jester.png" alt="Jester Hat" class="jester-panel-overlay">
       <div class="text-type-wrapper">
         <div id="textTypeEngine1" class="text-type"></div>
       </div>
    </div>
    <div class="scroll-hint">
      <div class="scroll-arrow"></div>
      <span>descend</span>
    </div>
  </section>

  <section id="s2">
    <div class="terminal-canvas-container" id="terminal-bg"></div>
    
    <div class="jester-content-card">
      <div class="curved-loop-jacket">
        <div class="curved-loop-svg-target" style="width:100%;"></div>
      </div>
      <div class="text-type-wrapper">
         <div id="textTypeEngine2" class="text-type"></div>
      </div>
    </div>
  </section>

</div>

<script type="module">
// ── WEBGL INTERACTIVE SHADER GENERATOR via OGL LIGHTWEIGHT PIPELINE ──
import { Renderer, Program, Mesh, Triangle, Color } from 'https://unpkg.com/ogl';

const vertexShader = `
attribute vec2 position;
attribute vec2 uv;
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragmentShader = `
precision mediump float;
varying vec2 vUv;
uniform float iTime;
uniform vec3  iResolution;
uniform float uScale;
uniform vec2  uGridMul;
uniform float uDigitSize;
uniform float uScanlineIntensity;
uniform float uGlitchAmount;
uniform float uFlickerAmount;
uniform float uNoiseAmp;
uniform float uChromaticAberration;
uniform float uDither;
uniform float uCurvature;
uniform vec3  uTint;
uniform vec2  uMouse;
uniform float uMouseStrength;
uniform float uUseMouse;
uniform float uPageLoadProgress;
uniform float uUsePageLoadAnimation;
uniform float uBrightness;

float time;

float hash21(vec2 p){
  p = fract(p * 234.56);
  p += dot(p, p + 34.56);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  return sin(p.x * 10.0) * sin(p.y * (3.0 + sin(time * 0.090909))) + 0.2; 
}

mat2 rotate(float angle) {
  float c = cos(angle);
  float s = sin(angle);
  return mat2(c, -s, s, c);
}

float fbm(vec2 p) {
  p *= 1.1;
  float f = 0.0;
  float amp = 0.5 * uNoiseAmp;
  mat2 modify0 = rotate(time * 0.02);
  f += amp * noise(p);
  p = modify0 * p * 2.0;
  amp *= 0.454545;
  mat2 modify1 = rotate(time * 0.02);
  f += amp * noise(p);
  p = modify1 * p * 2.0;
  amp *= 0.454545;
  mat2 modify2 = rotate(time * 0.08);
  f += amp * noise(p);
  return f;
}

float pattern(vec2 p, out vec2 q, out vec2 r) {
  vec2 offset1 = vec2(1.0);
  vec2 offset0 = vec2(0.0);
  mat2 rot01 = rotate(0.1 * time);
  mat2 rot1 = rotate(0.1);
  q = vec2(fbm(p + offset1), fbm(rot01 * p + offset1));
  r = vec2(fbm(rot1 * q + offset0), fbm(q + offset0));
  return fbm(p + r);
}

float digit(vec2 p){
    vec2 grid = uGridMul * 15.0;
    vec2 s = floor(p * grid) / grid;
    p = p * grid;
    vec2 q, r;
    float intensity = pattern(s * 0.1, q, r) * 1.3 - 0.03;
    if(uUseMouse > 0.5){
        vec2 mouseWorld = uMouse * uScale;
        float distToMouse = distance(s, mouseWorld);
        float mouseInfluence = exp(-distToMouse * 8.0) * uMouseStrength * 10.0;
        intensity += mouseInfluence;
        float ripple = sin(distToMouse * 20.0 - iTime * 5.0) * 0.1 * mouseInfluence;
        intensity += ripple;
    }
    if(uUsePageLoadAnimation > 0.5){
        float cellRandom = fract(sin(dot(s, vec2(12.9898, 78.233))) * 43758.5453);
        float cellDelay = cellRandom * 0.8;
        float cellProgress = clamp((uPageLoadProgress - cellDelay) / 0.2, 0.0, 1.0);
        float fadeAlpha = smoothstep(0.0, 1.0, cellProgress);
        intensity *= fadeAlpha;
    }
    p = fract(p);
    p *= uDigitSize;
    float px5 = p.x * 5.0;
    float py5 = (1.0 - p.y) * 5.0;
    float x = fract(px5);
    float y = fract(py5);
    float i = floor(py5) - 2.0;
    float j = floor(px5) - 2.0;
    float n = i * i + j * j;
    float f = n * 0.0625;
    float isOn = step(0.1, intensity - f);
    float brightness = isOn * (0.2 + y * 0.8) * (0.75 + x * 0.25);
    return step(0.0, p.x) * step(p.x, 1.0) * step(0.0, p.y) * step(p.y, 1.0) * brightness;
}

float onOff(float a, float b, float c) {
  return step(c, sin(iTime + a * cos(iTime * b))) * uFlickerAmount;
}

float displace(vec2 look) {
    float y = look.y - mod(iTime * 0.25, 1.0);
    float window = 1.0 / (1.0 + 50.0 * y * y);
    return sin(look.y * 20.0 + iTime) * 0.0125 * onOff(4.0, 2.0, 0.8) * (1.0 + cos(iTime * 60.0)) * window;
}

vec3 getColor(vec2 p){
    float bar = step(mod(p.y + time * 20.0, 1.0), 0.2) * 0.4 + 1.0;
    bar *= uScanlineIntensity;
    float displacement = displace(p);
    p.x += displacement;
    if (uGlitchAmount != 1.0) {
      float extra = displacement * (uGlitchAmount - 1.0);
      p.x += extra;
    }
    float middle = digit(p);
    const float off = 0.002;
    float sum = digit(p + vec2(-off, -off)) + digit(p + vec2(0.0, -off)) + digit(p + vec2(off, -off)) +
                digit(p + vec2(-off, 0.0)) + digit(p + vec2(0.0, 0.0)) + digit(p + vec2(off, 0.0)) +
                digit(p + vec2(-off, off)) + digit(p + vec2(0.0, off)) + digit(p + vec2(off, off));
    vec3 baseColor = vec3(0.9) * middle + sum * 0.1 * vec3(1.0) * bar;
    return baseColor;
}

vec2 barrel(vec2 uv){
  vec2 c = uv * 2.0 - 1.0;
  float r2 = dot(c, c);
  c *= 1.0 + uCurvature * r2;
  return c * 0.5 + 0.5;
}

void main() {
    time = iTime * 0.333333;
    vec2 uv = vUv;
    if(uCurvature != 0.0){ uv = barrel(uv); }
    vec2 p = uv * uScale;
    vec3 col = getColor(p);
    if(uChromaticAberration != 0.0){
      vec2 ca = vec2(uChromaticAberration) / iResolution.xy;
      col.r = getColor(p + ca).r;
      col.b = getColor(p - ca).b;
    }
    col *= uTint;
    col *= uBrightness;
    if(uDither > 0.0){
      float rnd = hash21(gl_FragCoord.xy);
      col += (rnd - 0.5) * (uDither * 0.003922);
    }
    gl_FragColor = vec4(col, 1.0);
}
`;

function initFaultyTerminal() {
    const container = document.getElementById('terminal-bg');
    const renderer = new Renderer({ alpha: true, premultipliedAlpha: false });
    const gl = renderer.gl;
    container.appendChild(gl.canvas);

    const geometry = new Triangle(gl);
    const tintColor = new Color('#800000'); // HARD TINT TO DARK RED PER INSTRUCTION

    const program = new Program(gl, {
        vertex: vertexShader,
        fragment: fragmentShader,
        uniforms: {
            iTime: { value: 0 },
            iResolution: { value: new Color(window.innerWidth, window.innerHeight, window.innerWidth / window.innerHeight) },
            uScale: { value: 1.5 },
            uGridMul: { value: [2, 1] },
            uDigitSize: { value: 1.2 },
            uScanlineIntensity: { value: 1 },
            uGlitchAmount: { value: 1 },
            uFlickerAmount: { value: 1 },
            uNoiseAmp: { value: 1 },
            uChromaticAberration: { value: 0 },
            uDither: { value: 0 },
            uCurvature: { value: 0 },
            uTint: { value: tintColor },
            uMouse: { value: [0.5, 0.5] },
            uMouseStrength: { value: 0.5 },
            uUseMouse: { value: 1 },
            uPageLoadProgress: { value: 1 },
            uUsePageLoadAnimation: { value: 0 },
            uBrightness: { value: 1 }
        }
    });

    const mesh = new Mesh(gl, { geometry, program });

    function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        program.uniforms.iResolution.value.set(gl.canvas.width, gl.canvas.height, gl.canvas.width / gl.canvas.height);
    }
    window.addEventListener('resize', resize);
    resize();

    let mouse = [0.5, 0.5];
    window.addEventListener('mousemove', e => {
        mouse[0] = e.clientX / window.innerWidth;
        mouse[1] = 1 - (e.clientY / window.innerHeight);
    });

    function update(t) {
        requestAnimationFrame(update);
        program.uniforms.iTime.value = t * 0.001;
        program.uniforms.uMouse.value[0] += (mouse[0] - program.uniforms.uMouse.value[0]) * 0.05;
        program.uniforms.uMouse.value[1] += (mouse[1] - program.uniforms.uMouse.value[1]) * 0.05;
        renderer.render({ scene: mesh });
    }
    requestAnimationFrame(update);
}

window.addEventListener('DOMContentLoaded', () => {
    initFaultyTerminal();
});
</script>

<script>
// ── SCROLL RESTORATION OVERRIDE ──
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
window.addEventListener('beforeunload', () => {
  const container = document.getElementById('scroll-container');
  if(container) container.scrollTop = 0;
});

// ── CUSTOM INTEGRATED CURSOR LOGIC ──
const cursor=document.getElementById('cursor');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
document.addEventListener('mousedown',()=>cursor.classList.add('big'));
document.addEventListener('mouseup',()=>cursor.classList.remove('big'));

const scrollContainer = document.getElementById('scroll-container');

// ── PERSISTENT SECT PARALLAX ──
function updateParallax(){
  const vh=window.innerHeight;
  document.querySelectorAll('section').forEach(s=>{
    const bg=s.querySelector('.bg');
    if(!bg) return;
    const rect=s.getBoundingClientRect();
    const prog=rect.top/vh;
    const nx=(mx/window.innerWidth-0.5)*2;
    const ny=(my/window.innerHeight-0.5)*2;
    bg.style.transform=`scale(1.06) translate(${nx*10}px,${ny*8+prog*25}px)`;
  });
}
document.addEventListener('mousemove',updateParallax);
scrollContainer.addEventListener('scroll',updateParallax,{passive:true});

// ── DOT SYSTEM MAP NAVIGATION ──
const dots=document.querySelectorAll('.dot');
const sections=document.querySelectorAll('section');
dots.forEach(d=>{
  d.addEventListener('click',()=>sections[+d.dataset.i].scrollIntoView({behavior:'smooth'}));
});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i=Array.from(sections).indexOf(e.target);
      dots.forEach((d,j)=>d.classList.toggle('active',i===j));
    }
  });
},{root: scrollContainer, threshold:0.5});
sections.forEach(s=>obs.observe(s));

// ── SPARK PARTICLE LAYER INTERACTION ──
document.addEventListener('click',e=>{
  if (e.target.closest('.curved-loop-svg')) return;
  const r=document.createElement('div');
  r.className='ripple';
  r.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:40px;height:40px;`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),750);
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    const a=Math.random()*Math.PI*2,d=15+Math.random()*45;
    s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.animationDuration=(0.35+Math.random()*0.4)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
});

// ── CHRONO POOL SHUFFLE ENGINE (HELLO WORLD FIXED AT INDEX 0) ──
function initTextTypeEngine(id) {
  const target = document.getElementById(id);
  if(!target) return;

  const pool = [
    "the world is a kingdom, you are a jester",
    "oversee everyone, as you hold order in your speech",
    "entertain the world, you are a fool after all",
    "gilded crowns are heavy, but masks never slip",
    "behind every synthetic horizon lies an empty stage",
    "a digital paradise built for analog tears",
    "dance for your audience of shadows and glass",
    "the applause is real, the performer is missing",
    "laugh through the neon, weep in the code",
    "we are all players in an automated theater",
    "your chains are made of gold and illusions",
    "the ultimate tragedy is a silent crowd"
  ];
  
  // Fisher-Yates shuffle exclusively for the secondary pool
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  
  // Anchor Hello World explicitly to top of array index 0
  const textArray = ["Hello world", ...pool];
  let displayedText = "", charIdx = 0, isDeleting = false, textIdx = 0, timeout;
  target.innerHTML = `<span class="text-type__content"></span><span class="text-type__cursor">|</span>`;
  const contentNode = target.querySelector('.text-type__content');

  function execute() {
    const current = textArray[textIdx];
    if (isDeleting) {
      if (displayedText === '') {
        isDeleting = false; textIdx = (textIdx + 1) % textArray.length; charIdx = 0;
        timeout = setTimeout(execute, 300);
      } else {
        timeout = setTimeout(() => {
          displayedText = displayedText.slice(0, -1);
          contentNode.textContent = displayedText;
          execute();
        }, 20);
      }
    } else {
      if (charIdx < current.length) {
        timeout = setTimeout(() => {
          displayedText += current[charIdx];
          contentNode.textContent = displayedText;
          charIdx++;
          execute();
        }, 55);
      } else {
        timeout = setTimeout(() => { isDeleting = true; execute(); }, 2200);
      }
    }
  }
  execute();
}

// ── MARQUEE SVG PATH LOOPER ──
function createCurvedLoop() {
  const target = document.querySelector('.curved-loop-svg-target');
  if(!target) return;
  const marqueeText = "THE SHOW MUST GO ON ✦ THE MASK NEVER SLIPS ✦ DANCE FOR THE KINGDOM OF SHADOWS ✦ ";
  const uid = 'curved-path';
  const pathD = `M-400,30 Q720,210 1840,30`;
  target.innerHTML = `<svg class="curved-loop-svg" viewBox="0 0 1440 220"><defs><path id="${uid}" d="${pathD}" fill="none" /></defs><text ref="measure" style="visibility:hidden; opacity:0; font-weight:700;">${marqueeText}</text><text font-weight="bold"><textPath id="loopTextPath" href="#${uid}" startOffset="0px"></textPath></text></svg>`;
  const textPathNode = document.getElementById('loopTextPath');
  const measureNode = target.querySelector('text[ref="measure"]');
  setTimeout(() => {
    const spacing = measureNode.getComputedTextLength() || 600;
    let longString = ""; for(let i=0; i<8; i++) longString += marqueeText;
    textPathNode.textContent = longString;
    let offset = -spacing;
    function render() {
      offset += 2.5;
      if(offset > 0) offset -= spacing;
      textPathNode.setAttribute('startOffset', offset + 'px');
      requestAnimationFrame(render);
    }
    render();
  }, 100);
}

window.addEventListener('DOMContentLoaded', () => {
  initTextTypeEngine('textTypeEngine1');
  initTextTypeEngine('textTypeEngine2');
  createCurvedLoop();
});
</script>
