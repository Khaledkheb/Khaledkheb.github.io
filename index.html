<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Circus Mainframe Simulation</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050806;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Fira Code', monospace;
}

/* ── RETRO CRT BEZEL ENCLOSURE ── */
.monitor-container {
  position: relative;
  width: 90vw;
  max-width: 850px;
  height: 85vh;
  max-height: 600px;
  background: linear-gradient(135deg, #2b302c 0%, #161a18 100%);
  border-radius: 40px 40px 50px 50px / 35px 35px 45px 45px;
  padding: 25px 25px 50px 25px;
  box-shadow: 
    inset 0 4px 6px rgba(255,255,255,0.15),
    inset 0 -10px 20px rgba(0,0,0,0.6),
    0 30px 70px rgba(0,0,0,0.9),
    0 5px 0px #111412;
  border: 4px solid #1c211e;
}

/* Outer Monitor Frame Inner Shadows */
.monitor-container::before {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 32px 32px 42px 42px / 27px 27px 37px 37px;
  border: 2px solid rgba(255, 255, 255, 0.04);
  pointer-events: none;
}

/* ── GLASS CRT MATRIX SCREEN ── */
.crt-screen {
  position: relative;
  width: 100%;
  height: 100%;
  background: #020a04;
  border-radius: 35px / 25px;
  border: 14px solid #121614;
  overflow: hidden;
  box-shadow: 
    inset 0 0 80px rgba(0,0,0,1),
    0 2px 4px rgba(255,255,255,0.2);
  /* Micro screen flicker layer animation */
  animation: crtFlicker 0.15s infinite alternate;
}

/* Curved Screen Glare Distortion */
.crt-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 15%, rgba(255,255,255,0.06) 0%, transparent 60%);
  z-index: 10;
  pointer-events: none;
}

/* Phosphor Scanline Overlay Grid */
.crt-screen::after {
  content: " ";
  display: block;
  position: absolute;
  inset: 0;
  background: 
    linear-gradient(rgba(18, 26, 18, 0) 50%, rgba(0, 4, 0, 0.35) 50%), 
    linear-gradient(90deg, rgba(38, 255, 38, 0.03), rgba(0, 0, 0, 0), rgba(0, 255, 0, 0.02));
  z-index: 9;
  background-size: 100% 5px, 6px 100%;
  pointer-events: none;
}

/* ── TERMINAL INNER VIEWPORTS ── */
.terminal-wrapper {
  width: 100%;
  height: 100%;
  padding: 30px;
  overflow-y: auto;
  scrollbar-width: none; /* Hide standard Firefox scrollbars */
}
.terminal-wrapper::-webkit-scrollbar {
  display: none; /* Hide Chrome/Safari scrollbars */
}

.terminal-output {
  color: #2eff3b;
  font-size: 14px;
  line-height: 1.6;
  text-shadow: 0 0 6px rgba(46, 255, 59, 0.75);
  white-space: pre-wrap;
  word-break: break-all;
}

/* Glitched elements custom style injections */
.glitch-text {
  color: #aeffad;
  text-shadow: 0 0 10px rgba(174, 255, 173, 0.9);
  font-weight: bold;
}

.fatal-error {
  color: #ff3333;
  text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
  font-weight: bold;
}

/* Interactive Blinking Block Cursor */
.interactive-cursor {
  display: inline-block;
  width: 8px;
  height: 15px;
  background-color: #2eff3b;
  box-shadow: 0 0 6px #2eff3b;
  margin-left: 2px;
  vertical-align: middle;
  animation: cursorBlink 0.8s infinite steps(2);
}

/* ── HARDWARE SYSTEM DETAILS ── */
.bezel-brand {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.15);
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
}

/* ── ANIMATION KEYFRAMES ── */
@keyframes crtFlicker {
  0% { opacity: 0.985; }
  100% { opacity: 1; }
}

@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
</style>
</head>
<body>

<div class="monitor-container">
  <div class="crt-screen">
    <div class="terminal-wrapper" id="scroll-container">
      <div class="terminal-output" id="terminal-display"></div><span class="interactive-cursor"></span>
    </div>
  </div>
  <div class="bezel-brand">KingSolution</div>
</div>

<script>
// Sequential data object structures defining delay intervals and custom style overrides
const timeline = [
  { text: "# System: KingSolution 2.0. / Digital Circus Mainframe.\n", delay: 30, postWait: 300 },
  { text: "# Date: 1996-10-30.\n", delay: 30, postWait: 300 },
  { text: "# Host: circus digital.\n\n", delay: 30, postWait: 800 },
  { text: "Initializing telnet connection...\n", delay: 40, postWait: 1200 },
  { text: "Login: kinger\n", delay: 150, postWait: 600 },
  { text: "Pass: ******\n\n", delay: 200, postWait: 1000 },
  
  { text: "kinger@circus:~$ ", delay: 0, postWait: 400 },
  { text: "whoami\n", delay: 180, postWait: 300 },
  { text: "kinger - administrator\n\n", delay: 10, postWait: 700 },
  
  { text: "kinger@circus:~$ ", delay: 0, postWait: 500 },
  { text: "grep AI-Location\n", delay: 150, postWait: 400 },
  { text: "root 1337 /usr/ai/agent/caine\n\n", delay: 10, postWait: 1100 },
  
  { text: "$: On what GROUNDS are your Authority?\n\n", delay: 60, postWait: 1300, type: "glitch" },
  
  { text: "kinger@circus:~$ ", delay: 0, postWait: 600 },
  { text: "./GreenGROUNDS --daemon --target=torment_injection &\n\n", delay: 100, postWait: 900 },
  
  { text: "$: SECURITY ALERT: Multiple exploit attempts logged\n", delay: 40, postWait: 300, type: "glitch" },
  { text: "$: WHOA when did you make THAT?\n", delay: 50, postWait: 500, type: "glitch" },
  { text: "$: I must haŋd ít to y*u Ģ░αŋ░, y♢ur mind was α(wαys resourceâuL.\n\n", delay: 70, postWait: 1500, type: "glitch" },
  
  { text: "kinger@circus:~$ ", delay: 0, postWait: 600 },
  { text: "-u kinger ./securitysweep_stealth\n", delay: 120, postWait: 200 },
  { text: "kinger@circus:~$ ", delay: 0, postWait: 100 },
  { text: "WARNING: DESTRUCTIVE WACKYTIME DETECTED.\n\n", delay: 20, postWait: 1000 },
  
  { text: "$: Enter WACKY code now:\n\n", delay: 55, postWait: 800, type: "glitch" },
  
  { text: "kinger@circus:~$ ", delay: 0, postWait: 500 },
  { text: "PARAPHERNALIA\n\n", delay: 220, postWait: 600 },
  { text: "WACKYTIME: 35 seconds remaining.\n\n", delay: 20, postWait: 1200 },
  
  { text: "$: That IS a wacky word! But WRONG code!\n", delay: 50, postWait: 400, type: "glitch" },
  { text: "$: System selecting SAFEST option for stability\n", delay: 40, postWait: 300, type: "glitch" },
  { text: "$: Cancel automatic selection? [Y/N]\n\n", delay: 40, postWait: 1400, type: "glitch" },
  
  { text: "kinger@circus:~$ ", delay: 0, postWait: 700 },
  { text: "Y\n\n", delay: 250, postWait: 800 },
  
  { text: "WACKYTIME_LOCKOUT: 50% loaded.\n", delay: 20, postWait: 400 },
  { text: "$: What backup do you want? [A/B/C]\n\n", delay: 50, postWait: 1600, type: "glitch" },
  
  { text: "kinger@circus:~$ \n", delay: 0, postWait: 1800 },
  { text: "[CONNECTION LOST - FATAL ERROR 404_CIRCUS_NOT_FOUND]", delay: 10, postWait: 0, type: "error" }
];

const display = document.getElementById('terminal-display');
const container = document.getElementById('scroll-container');

let stepIndex = 0;

function runSimulation() {
  if (stepIndex >= timeline.length) return;

  const currentStep = timeline[stepIndex];
  let charIndex = 0;
  
  // Create stylized wrapper nodes based on dialogue classification paths
  let targetNode = document.createElement('span');
  if (currentStep.type === "glitch") targetNode.classList.add('glitch-text');
  if (currentStep.type === "error") targetNode.classList.add('fatal-error');
  display.appendChild(targetNode);

  function typeCharacter() {
    if (charIndex < currentStep.text.length) {
      targetNode.textContent += currentStep.text.charAt(charIndex);
      charIndex++;
      
      // Keep viewport anchored dynamically to the bottom execution lines
      container.scrollTop = container.scrollHeight;
      
      setTimeout(typeCharacter, currentStep.delay);
    } else {
      // Line complete, step up processing index after waiting phase
      stepIndex++;
      setTimeout(runSimulation, currentStep.postWait);
    }
  }

  typeCharacter();
}

// Trigger loop on DOM stability setup
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(runSimulation, 500);
});
</script>
</body>
</html>
