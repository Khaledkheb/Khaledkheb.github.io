<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Aero Vista</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{overflow-y:scroll;height:100%;scroll-behavior: smooth;}
body{cursor:none;font-family:'Raleway',sans-serif;background:#000;overflow-x:hidden;}

/* ── CURSOR ── */
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95),rgba(160,220,255,0.6),rgba(80,180,240,0.2));border:1px solid rgba(255,255,255,0.8);box-shadow:0 0 10px rgba(120,200,255,0.5);mix-blend-mode:screen;transition:width 0.15s,height 0.15s;}
#cursor.big{width:55px;height:55px;}

/* ── TITLEBAR ── */
#titlebar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:44px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:translateY(-10px);
  transition:opacity 0.5s ease, transform 0.5s ease;
  background:linear-gradient(180deg,rgba(255,255,255,0.42) 0%,rgba(220,240,255,0.28) 100%);
  border-bottom:1px solid rgba(255,255,255,0.65);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 2px 20px rgba(80,160,220,0.18),inset 0 1px 0 rgba(255,255,255,0.9);
}
#titlebar.visible{opacity:1;transform:translateY(0);}

.traffic{position:absolute;left:16px;display:flex;gap:7px;align-items:center;}
.tl{width:13px;height:13px;border-radius:50%;}
.tl.r{background:radial-gradient(circle at 40% 35%,#ff8a8a,#e03030);box-shadow:0 1px 3px rgba(180,0,0,0.3);}
.tl.y{background:radial-gradient(circle at 40% 35%,#ffe080,#d4a000);box-shadow:0 1px 3px rgba(160,120,0,0.3);}
.tl.g{background:radial-gradient(circle at 40% 35%,#80e880,#20a020);box-shadow:0 1px 3px rgba(0,140,0,0.3);}

#titlebar-text{
  font-size:14px;font-weight:300;letter-spacing:5px;text-transform:uppercase;
  color:rgba(40,80,140,0.85);
  text-shadow:0 1px 3px rgba(255,255,255,0.8);
  user-select:none;
}

/* ── TRACKING FLOATING COMPONENT HEADLINE ── */
#hero-title{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:190;
  text-align:center;
  pointer-events:none;
  transition:none;
  will-change:transform,top,left,font-size,opacity,letter-spacing;
}
#hero-title h1{
  font-size:clamp(52px,9vw,108px);
  font-weight:200;
  letter-spacing:12px;
  color:rgba(255,255,255,0.97);
  text-shadow:0 2px 40px rgba(80,200,255,0.7),0 0 80px rgba(255,255,255,0.2);
  white-space:nowrap;
  opacity:0; /* hidden on initial state to prevent welcome overlap errors */
  transition:font-size 0.6s cubic-bezier(0.4,0,0.2,1),
             letter-spacing 0.6s cubic-bezier(0.4,0,0.2,1),
             color 0.6s ease,
             text-shadow 0.6s ease;
}

/* ── SECTIONS ── */
section{
  width:100vw;height:100vh;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

.bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transform:scale(1.06);
  transition:transform 0.1s linear;
  will-change:transform;
}

section::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,20,60,0.3) 100%);
}

#intro .bg{
  background-color:#0d4b75; 
  background-image: radial-gradient(circle at 50% 40%, #1a82c4 0%, #093758 70%, #021726 100%);
}
#s1 .bg{
  background-image: url('img1.jpg');
  background-color:#2090c8; 
  background-image: url('img1.jpg'), radial-gradient(circle at 30% 30%, #3ca9e2 0%, #156293 100%);
}
#s2 .bg{
  background-image: url('img2.jpg');
  background-color:#3aaa50; 
  background-image: url('img2.jpg'), radial-gradient(circle at 70% 60%, #52ca69 0%, #217332 100%);
}

/* ── FRUTIGER AERO INTRO HOME ELEMENTS ── */
.aero-home-card {
  z-index: 10;
  text-align: center;
  width: 85%;
  max-width: 800px;
  padding: 60px 50px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(180, 225, 255, 0.12) 100%);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 32px;
  backdrop-filter: blur(25px) saturate(1.7);
  -webkit-backdrop-filter: blur(25px) saturate(1.7);
  box-shadow: 0 40px 80px rgba(0, 20, 50, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.8);
  animation: cardFadeIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(30px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.aero-tagline {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 7px;
  text-transform: uppercase;
  color: #e2f3ff;
  text-shadow: 0 2px 10px rgba(0, 100, 220, 0.5);
  margin-bottom: 25px;
}

/* ── NATIVE PORTED TEXT-TYPE ENGINE STYLING ── */
.text-type {
  display: inline-block;
  white-space: pre-wrap;
  font-size: clamp(32px, 4.5vw, 56px);
  font-weight: 300;
  letter-spacing: 3px;
  color: #ffffff;
  text-shadow: 0 4px 20px rgba(0, 150, 255, 0.6), 0 0 40px rgba(255,255,255,0.4);
  line-height: 1.3;
  min-height: 2.6em; /* Prevents layout card jank during delete sequences */
}

.text-type__cursor {
  margin-left: 0.25rem;
  display: inline-block;
  font-weight: 200;
  color: #a0e0ff;
  text-shadow: 0 0 15px #00a2ff;
}

/* Eco Environment Glass Bubbles Engine */
.aero-bubble {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.05) 40%, transparent 70%);
  border: 0.5px solid rgba(255, 255, 255, 0.35);
  box-shadow: inset -3px -3px 12px rgba(0,100,240,0.15), inset 3px 3px 8px rgba(255,255,255,0.4), 0 10px 25px rgba(0,0,0,0.08);
  pointer-events: none;
  animation: floatBubble infinite ease-in-out;
}
@keyframes floatBubble {
  0%, 100% { transform: translateY(0) translateX(0) scale(1); }
  50% { transform: translateY(-40px) translateX(15px) scale(1.04); }
}

/* scroll hint */
.scroll-hint{
  position:absolute;bottom:44px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;
  opacity:0;animation:hintIn 1s 2.5s ease forwards;
  z-index: 20;
}
@keyframes hintIn{to{opacity:0.65;}}
.scroll-hint span{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.85);text-transform:uppercase;}
.scroll-arrow{width:1px;height:36px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.9));animation:arrowPulse 2s ease-in-out infinite;}
@keyframes arrowPulse{0%,100%{opacity:0.6;transform:scaleY(0.85);}50%{opacity:1;transform:scaleY(1.15);}}

/* nav dots */
#dots{position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px;}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,0.35);border:1.5px solid rgba(255,255,255,0.7);cursor:none;transition:all 0.3s ease;}
.dot.active{background:rgba(255,255,255,0.95);transform:scale(1.4);box-shadow:0 0 7px rgba(255,255,255,0.7);}

/* ripple & sparkle */
.ripple{position:fixed;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);pointer-events:none;z-index:9996;animation:rippleOut 0.7s ease-out forwards;transform:translate(-50%,-50%) scale(0);}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(5);opacity:0;}}
.sparkle{position:fixed;width:5px;height:5px;background:#fff;border-radius:50%;pointer-events:none;z-index:9995;box-shadow:0 0 5px 2px rgba(200,240,255,0.8);animation:sparkPop ease-out forwards;}
@keyframes sparkPop{0%{transform:scale(0);opacity:1;}100%{transform:scale(2) translate(var(--dx),var(--dy));opacity:0;}}

/* ── EXPANDED LOOP CONTAINER CARD ── */
.aero-content-card {
  z-index: 10;
  width: 92%;
  max-width: 1200px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(200, 235, 255, 0.15) 100%);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 28px;
  backdrop-filter: blur(25px) saturate(1.6);
  -webkit-backdrop-filter: blur(25px) saturate(1.6);
  box-shadow: 0 30px 60px rgba(0, 30, 60, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  padding: 80px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CURVED LOOP VANILLA LAYER ── */
.curved-loop-jacket {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 6%, #000 94%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 6%, #000 94%, transparent 100%);
}

.curved-loop-svg {
  user-select: none;
  -webkit-user-select: none;
  width: 100%;
  aspect-ratio: 1440 / 220;
  overflow: visible;
  display: block;
}

.curved-loop-svg text {
  font-size: 2.8rem;
  font-weight: 700;
  text-transform: uppercase;
  fill: #ffffff;
  text-shadow: 0 4px 16px rgba(0, 50, 100, 0.25);
  letter-spacing: 2px;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

<div id="cursor"></div>

<div id="titlebar">
  <div class="traffic"><div class="tl r"></div><div class="tl y"></div><div class="tl g"></div></div>
  <div id="titlebar-text">AERO</div>
</div>

<div id="hero-title"><h1>AERO</h1></div>

<div id="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
  <div class="dot" data-i="2"></div>
</div>

<section id="intro">
  <div class="bg" id="bg0"></div>
  
  <div class="aero-bubble" style="width: 140px; height: 140px; top: 15%; left: 10%; animation-duration: 9s;"></div>
  <div class="aero-bubble" style="width: 80px; height: 80px; top: 65%; left: 18%; animation-duration: 7s; animation-delay: -2s;"></div>
  <div class="aero-bubble" style="width: 110px; height: 110px; bottom: 12%; right: 12%; animation-duration: 11s; animation-delay: -4s;"></div>
  <div class="aero-bubble" style="width: 60px; height: 60px; top: 22%; right: 25%; animation-duration: 6s;"></div>
  
  <div class="aero-home-card">
    <p class="aero-tagline">System Workspace Overview</p>
    <div id="textTypeEngine" class="text-type"></div>
  </div>
  
  <div class="scroll-hint">
    <div class="scroll-arrow"></div>
    <span>Scroll Exploration</span>
  </div>
</section>

<section id="s1">
  <div class="bg" id="bg1"></div>
  <div class="scroll-hint">
    <div class="scroll-arrow"></div>
    <span>scroll</span>
  </div>
</section>

<section id="s2">
  <div class="bg" id="bg2"></div>
  
  <div class="aero-content-card">
    <div class="curved-loop-jacket">
      <div class="curved-loop-svg-target" style="width:100%;"></div>
    </div>
  </div>
</section>

<script>
// ── CURSOR ──
const cursor=document.getElementById('cursor');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
document.addEventListener('mousedown',()=>cursor.classList.add('big'));
document.addEventListener('mouseup',()=>cursor.classList.remove('big'));

// ── TITLEBAR + HERO TITLE ANIMATION ──
const heroTitle=document.getElementById('hero-title');
const titlebar=document.getElementById('titlebar');
const heroH1=heroTitle.querySelector('h1');
let titleSettled=false;

function updateTitle(){
  const scrollY=window.scrollY;
  const vh=window.innerHeight;
  
  // Calculate transformation mechanics based strictly on content section offsets
  const progress=Math.min(1, Math.max(0, (scrollY - vh) / (vh * 0.38)));

  if(scrollY < vh){
    heroH1.style.opacity = '0';
    titlebar.classList.remove('visible');
    titleSettled=false;
    return;
  }

  heroH1.style.opacity = '1';

  if(progress<1){
    const startTop=50;
    const endTop=22/vh*100;
    const curTop=startTop+(endTop-startTop)*easeInOut(progress);
    const scale=1-progress*0.88;
    heroTitle.style.transition='none';
    heroTitle.style.top=curTop+'vh';
    heroTitle.style.left='50%';
    heroTitle.style.transform=`translate(-50%,-50%) scale(${scale})`;
    heroTitle.style.opacity=1;
    
    const startFs=Math.min(108,Math.max(52,window.innerWidth*0.09));
    const endFs=14;
    const fs=startFs+(endFs-startFs)*easeInOut(progress);
    const startLs=12,endLs=5;
    const ls=startLs+(endLs-startLs)*easeInOut(progress);
    const r1=255,g1=255,b1=255;
    const r2=40,g2=80,b2=140;
    const ri=Math.round(r1+(r2-r1)*easeInOut(progress));
    const gi=Math.round(g1+(g2-g1)*easeInOut(progress));
    const bi=Math.round(b1+(b2-b1)*easeInOut(progress));
    heroH1.style.fontSize=fs+'px';
    heroH1.style.letterSpacing=ls+'px';
    heroH1.style.color=`rgba(${ri},${gi},${bi},0.85)`;
    heroH1.style.textShadow=`0 1px ${20-18*easeInOut(progress)}px rgba(80,200,255,${0.7-0.6*easeInOut(progress)})`;
    titleSettled=false;
    titlebar.classList.remove('visible');
  } else {
    if(!titleSettled){
      titleSettled=true;
      heroTitle.style.opacity='0';
      heroTitle.style.transition='opacity 0.2s ease';
      titlebar.classList.add('visible');
    }
  }
}

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

window.addEventListener('scroll',updateTitle,{passive:true});
updateTitle();

// ── PARALLAX ENGINE ──
function updateParallax(){
  const scrollY=window.scrollY;
  const vh=window.innerHeight;
  document.querySelectorAll('section').forEach(s=>{
    const bg=s.querySelector('.bg');
    if(!bg) return;
    const rect=s.getBoundingClientRect();
    const prog=rect.top/vh;
    const nx=(mx/window.innerWidth-0.5)*2;
    const ny=(my/window.innerHeight-0.5)*2;
    bg.style.transform=`scale(1.06) translate(${nx*10}px,${ny*8+prog*25}px)`;
  });
}
document.addEventListener('mousemove',updateParallax);
window.addEventListener('scroll',updateParallax,{passive:true});

// ── NAVIGATION TRACKING DOTS ──
const dots=document.querySelectorAll('.dot');
const sections=document.querySelectorAll('section');
dots.forEach(d=>{
  d.addEventListener('click',()=>sections[+d.dataset.i].scrollIntoView({behavior:'smooth'}));
});
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i=Array.from(sections).indexOf(e.target);
      dots.forEach((d,j)=>d.classList.toggle('active',i===j));
    }
  });
},{threshold:0.6});
sections.forEach(s=>obs.observe(s));

// ── WATER RIPPLE CLICK EFFECTS ──
document.addEventListener('click',e=>{
  if (e.target.closest('.curved-loop-svg')) return;
  const r=document.createElement('div');
  r.className='ripple';
  r.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:40px;height:40px;`;
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),750);
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    const a=Math.random()*Math.PI*2,d=15+Math.random()*45;
    s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.animationDuration=(0.35+Math.random()*0.4)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
});

// ── INTEGRATED NATIVE VANILLA PORT OF REACT BITS TEXTTYPE ENGINE ──
function initTextTypeEngine() {
  const target = document.getElementById('textTypeEngine');
  if(!target) return;

  const textArray = ["Text typing effect", "for your websites", "Happy coding!"];
  const typingSpeed = 75;
  const pauseDuration = 1500;
  const deletingSpeed = 30;
  const loop = true;
  const showCursor = true;
  const cursorCharacter = "|";
  const cursorBlinkDuration = 0.5;

  let displayedText = "";
  let currentCharIndex = 0;
  let isDeleting = false;
  let currentTextIndex = 0;
  let timeout;

  // Build inside DOM architecture setup
  target.innerHTML = `<span class="text-type__content"></span><span class="text-type__cursor">${cursorCharacter}</span>`;
  const contentNode = target.querySelector('.text-type__content');
  const cursorNode = target.querySelector('.text-type__cursor');

  // GSAP Cursor Blinking Engine Configuration
  if (showCursor && cursorNode && window.gsap) {
    gsap.set(cursorNode, { opacity: 1 });
    gsap.to(cursorNode, {
      opacity: 0,
      duration: cursorBlinkDuration,
      repeat: -1,
      yoyo: true,
      ease: 'power2.inOut'
    });
  } else if(!showCursor && cursorNode) {
    cursorNode.style.display = 'none';
  }

  function executeTypingAnimation() {
    const currentText = textArray[currentTextIndex];

    if (isDeleting) {
      if (displayedText === '') {
        isDeleting = false;
        if (currentTextIndex === textArray.length - 1 && !loop) return;
        currentTextIndex = (currentTextIndex + 1) % textArray.length;
        currentCharIndex = 0;
        timeout = setTimeout(executeTypingAnimation, 200);
      } else {
        timeout = setTimeout(() => {
          displayedText = displayedText.slice(0, -1);
          contentNode.textContent = displayedText;
          executeTypingAnimation();
        }, deletingSpeed);
      }
    } else {
      if (currentCharIndex < currentText.length) {
        timeout = setTimeout(() => {
          displayedText += currentText[currentCharIndex];
          contentNode.textContent = displayedText;
          currentCharIndex++;
          executeTypingAnimation();
        }, typingSpeed);
      } else {
        if (!loop && currentTextIndex === textArray.length - 1) return;
        timeout = setTimeout(() => {
          isDeleting = true;
          executeTypingAnimation();
        }, pauseDuration);
      }
    }
  }

  executeTypingAnimation();
}

// ── VANILLA MARQUEE LOOP ENGINE ──
const curvedLoopConfig = {
  marqueeText: "The Future is Clear: Connecting Worlds, Inspiring Possibilities ✦ ",
  speed: 2.5,
  curveAmount: 180, 
  direction: "right",
  interactive: true
};

function createCurvedLoop() {
  const targetContainer = document.querySelector('.curved-loop-svg-target');
  if(!targetContainer) return;
  
  const uid = 'curved-path-element';
  const pathD = `M-400,30 Q720,${30 + curvedLoopConfig.curveAmount} 1840,30`;
  
  targetContainer.innerHTML = `
    <svg class="curved-loop-svg" viewBox="0 0 1440 220">
      <defs>
        <path id="${uid}" d="${pathD}" fill="none" stroke="transparent" />
      </defs>
      <text ref="measureNode" style="visibility:hidden; opacity:0; pointer-events:none; font-weight:700;">${curvedLoopConfig.marqueeText}</text>
      <text font-weight="bold">
        <textPath id="loopTextPath" href="#${uid}" startOffset="0px"></textPath>
      </text>
    </svg>
  `;
  
  const textPathNode = document.getElementById('loopTextPath');
  const measureNode = targetContainer.querySelector('text[ref="measureNode"]');
  
  setTimeout(() => {
    const spacing = measureNode.getComputedTextLength() || 600;
    const repeatCount = Math.ceil(3200 / spacing) + 3;
    let longString = "";
    for(let i=0; i<repeatCount; i++) { longString += curvedLoopConfig.marqueeText; }
    textPathNode.textContent = longString;
    
    let currentOffset = -spacing;
    textPathNode.setAttribute('startOffset', currentOffset + 'px');
    
    let dragActive = false;
    let lastX = 0;
    let animDirection = curvedLoopConfig.direction;
    
    function renderLoop() {
      if(!dragActive) {
        const delta = animDirection === 'right' ? curvedLoopConfig.speed : -curvedLoopConfig.speed;
        currentOffset += delta;
        if(currentOffset <= -spacing * 2) currentOffset += spacing;
        if(currentOffset > 0) currentOffset -= spacing;
        textPathNode.setAttribute('startOffset', currentOffset + 'px');
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);
    
    if(curvedLoopConfig.interactive) {
      const svgEl = targetContainer.querySelector('.curved-loop-svg');
      svgEl.style.cursor = 'grab';
      
      svgEl.addEventListener('pointerdown', e => {
        dragActive = true;
        lastX = e.clientX;
        svgEl.style.cursor = 'grabbing';
        svgEl.setPointerCapture(e.pointerId);
      });
      
      svgEl.addEventListener('pointermove', e => {
        if(!dragActive) return;
        const dx = e.clientX - lastX;
        lastX = e.clientX;
        currentOffset += dx;
        if(currentOffset <= -spacing * 2) currentOffset += spacing;
        if(currentOffset > 0) currentOffset -= spacing;
        textPathNode.setAttribute('startOffset', currentOffset + 'px');
        if(Math.abs(dx) > 0.1) animDirection = dx > 0 ? 'right' : 'left';
      });
      
      const clearDrag = () => { dragActive = false; svgEl.style.cursor = 'grab'; };
      svgEl.addEventListener('pointerup', clearDrag);
      svgEl.addEventListener('pointerleave', clearDrag);
    }
  }, 100);
}

// Core compilation structural initializer loop
window.addEventListener('DOMContentLoaded', () => {
  initTextTypeEngine();
  createCurvedLoop();
});
</script>
</body>
</html>
