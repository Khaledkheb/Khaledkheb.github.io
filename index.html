<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ Aero Vista</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-snap-type:y mandatory;overflow-y:scroll;height:100%;}
body{cursor:none;font-family:'Raleway',sans-serif;}

/* custom cursor */
#cursor{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width 0.15s,height 0.15s,background 0.3s;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95),rgba(160,220,255,0.6),rgba(80,180,240,0.2));border:1px solid rgba(255,255,255,0.8);box-shadow:0 0 10px rgba(120,200,255,0.5);mix-blend-mode:screen;}
#cursor.big{width:55px;height:55px;}

/* scroll progress dots */
#dots{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:12px;}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.4);border:1.5px solid rgba(255,255,255,0.7);cursor:none;transition:all 0.3s ease;}
.dot.active{background:rgba(255,255,255,0.95);transform:scale(1.4);box-shadow:0 0 8px rgba(255,255,255,0.7);}

/* each section is fullscreen */
section{
  width:100vw;height:100vh;
  scroll-snap-align:start;
  position:relative;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* background image fills */
section .bg{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transition:transform 0.1s linear;
  will-change:transform;
}

/* glass overlay label — minimal */
.label{
  position:absolute;
  bottom:48px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(255,255,255,0.38),rgba(255,255,255,0.18));
  border:1px solid rgba(255,255,255,0.75);
  backdrop-filter:blur(16px) saturate(1.6);
  -webkit-backdrop-filter:blur(16px) saturate(1.6);
  border-radius:60px;
  padding:12px 36px;
  white-space:nowrap;
  box-shadow:0 8px 32px rgba(80,160,220,0.2),inset 0 1px 0 rgba(255,255,255,0.9);
  opacity:0;
  transform:translateX(-50%) translateY(20px);
  transition:opacity 0.6s ease, transform 0.6s ease;
}
.label.show{opacity:1;transform:translateX(-50%) translateY(0);}
.label span{
  font-size:15px;font-weight:300;letter-spacing:4px;text-transform:uppercase;
  color:rgba(255,255,255,0.95);
  text-shadow:0 1px 6px rgba(0,60,120,0.3);
}

/* section 1 — intro overlay */
.hero-text{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
  animation:heroIn 1.5s ease both;
}
@keyframes heroIn{from{opacity:0;transform:translate(-50%,-54%);}to{opacity:1;transform:translate(-50%,-50%);}}
.hero-text h1{
  font-size:clamp(52px,9vw,110px);font-weight:200;letter-spacing:12px;
  color:rgba(255,255,255,0.97);
  text-shadow:0 2px 40px rgba(80,200,255,0.7),0 0 80px rgba(255,255,255,0.2);
}
.hero-text p{
  font-size:16px;font-weight:300;letter-spacing:5px;
  color:rgba(255,255,255,0.75);margin-top:12px;
  text-shadow:0 1px 10px rgba(0,80,160,0.4);
  text-transform:uppercase;
}

/* vignette on all sections */
section::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(0,20,60,0.35) 100%);
}

/* scroll hint */
.scroll-hint{
  position:absolute;bottom:52px;right:52px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  opacity:0.7;animation:hintFade 2s 2s ease both;
  pointer-events:none;
}
@keyframes hintFade{from{opacity:0;}to{opacity:0.7;}}
.scroll-hint span{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.8);text-transform:uppercase;writing-mode:vertical-lr;}
.scroll-arrow{width:1px;height:40px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.8));animation:arrowPulse 1.8s ease-in-out infinite;}
@keyframes arrowPulse{0%,100%{transform:scaleY(1);opacity:0.7;}50%{transform:scaleY(1.3);opacity:1;}}

/* ripple */
.ripple{position:fixed;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);pointer-events:none;z-index:9998;animation:rippleOut 0.7s ease-out forwards;transform:translate(-50%,-50%) scale(0);}
@keyframes rippleOut{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(5);opacity:0;}}

/* sparkle */
.sparkle{position:fixed;width:5px;height:5px;background:#fff;border-radius:50%;pointer-events:none;z-index:9997;box-shadow:0 0 5px 2px rgba(200,240,255,0.8);animation:sparkPop ease-out forwards;}
@keyframes sparkPop{0%{transform:scale(0);opacity:1;}100%{transform:scale(0) translate(var(--dx),var(--dy));opacity:0;}}

/* section-specific tints */
#s1 .bg{background-image:url('img1.jpg');background-color:#2090c8;}
#s2 .bg{background-image:url('img2.jpg');background-color:#3aaa50;}
#s3 .bg{background-image:url('img3.jpg');background-color:#1878c0;}

/* transition overlays between sections */
.wipe{position:absolute;inset:0;pointer-events:none;z-index:10;opacity:0;background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(200,240,255,0.08));transition:opacity 0.4s;}
</style>
</head>
<body>

<div id="cursor"></div>

<div id="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
  <div class="dot" data-i="2"></div>
</div>

<section id="s1">
  <div class="bg" id="bg1"></div>
  <div class="wipe"></div>
  <div class="hero-text">
    <h1>AERO</h1>
    <p>scroll to explore</p>
  </div>
  <div class="scroll-hint">
    <div class="scroll-arrow"></div>
    <span>scroll</span>
  </div>
</section>

<section id="s2">
  <div class="bg" id="bg2"></div>
  <div class="wipe"></div>
  <div class="label"><span>Open Air</span></div>
</section>

<section id="s3">
  <div class="bg" id="bg3"></div>
  <div class="wipe"></div>
  <div class="label"><span>Submerged</span></div>
</section>

<script>
// cursor
const cursor=document.getElementById('cursor');
let mx=0,my=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
document.addEventListener('mousedown',()=>cursor.classList.add('big'));
document.addEventListener('mouseup',()=>cursor.classList.remove('big'));

// dots nav
const dots=document.querySelectorAll('.dot');
const sections=document.querySelectorAll('section');
dots.forEach(d=>{
  d.addEventListener('click',()=>{
    sections[+d.dataset.i].scrollIntoView({behavior:'smooth'});
  });
});

// active dot on scroll
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i=Array.from(sections).indexOf(e.target);
      dots.forEach((d,j)=>d.classList.toggle('active',i===j));
      // show label
      const lbl=e.target.querySelector('.label');
      if(lbl) setTimeout(()=>lbl.classList.add('show'),300);
    } else {
      const lbl=e.target.querySelector('.label');
      if(lbl) lbl.classList.remove('show');
    }
  });
},{threshold:0.6});
sections.forEach(s=>obs.observe(s));

// subtle parallax on scroll
window.addEventListener('scroll',()=>{
  sections.forEach((s,i)=>{
    const rect=s.getBoundingClientRect();
    const prog=rect.top/window.innerHeight;
    const bg=s.querySelector('.bg');
    if(bg) bg.style.transform=`translateY(${prog*30}px) scale(1.06)`;
  });
},{passive:true});

// mouse parallax within section
document.addEventListener('mousemove',e=>{
  const nx=(e.clientX/window.innerWidth-0.5)*2;
  const ny=(e.clientY/window.innerHeight-0.5)*2;
  document.querySelectorAll('.bg').forEach(bg=>{
    const rect=bg.parentElement.getBoundingClientRect();
    if(rect.top<window.innerHeight&&rect.bottom>0){
      const scrollProg=rect.top/window.innerHeight;
      bg.style.transform=`translateY(${scrollProg*30}px) scale(1.06) translate(${nx*10}px,${ny*8}px)`;
    }
  });
});

// click ripple + sparkles
document.addEventListener('click',e=>{
  const r=document.createElement('div');
  r.className='ripple';
  r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
  r.style.width='40px';r.style.height='40px';
  document.body.appendChild(r);
  setTimeout(()=>r.remove(),750);

  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='sparkle';
    const a=Math.random()*Math.PI*2,d=20+Math.random()*50;
    s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
    s.style.setProperty('--dx',(Math.cos(a)*d)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    s.style.animationDuration=(0.4+Math.random()*0.4)+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }
});
</script>
</body>
</html>
